# HyperTRIBE SLURM Resource Configuration
# =========================================
# Per-rule resource overrides for Snakemake cluster execution.
# Adjust partition names and account to match your HPC setup.
#
# Usage (referenced automatically by slurm/config.yaml):
#   snakemake --profile slurm --configfile config.yaml

# ── Default resources applied to every rule ──────────────────────────────────
__default__:
  account:    "abdelwao"
  partition:  "cpu"
  time:       "24:00:00"
  mem:        "64G"             # floor for all rules; enough for any single-sample step

# ── QC & Trimming ─────────────────────────────────────────────────────────────
cutadapt_trim:
  time:       "04:00:00"
  mem:        "64G"

# ── Alignment ────────────────────────────────────────────────────────────────
# hg38 STAR index ~28 GB + limitBAMsortRAM 48 GB = ~76 GB peak; 96 G gives headroom
star_align:
  time:       "08:00:00"
  mem:        "96G"

index_bam:
  time:       "01:00:00"
  mem:        "16G"

# ── PCR Duplicate Removal ────────────────────────────────────────────────────
# Picard loads the full BAM into heap; 64 G is comfortable for ~10-20 GB BAMs
picard_dedup:
  time:       "04:00:00"
  mem:        "64G"

index_dedup_bam:
  time:       "01:00:00"
  mem:        "16G"

# ── MultiQC ───────────────────────────────────────────────────────────────────
multiqc:
  time:       "01:00:00"
  mem:        "32G"

# ── Editing Site Calling (most CPU/memory intensive step) ────────────────────
# Loads all control + treatment BAMs simultaneously across parallel genome chunks
call_editing_sites:
  partition:  "cpu_highmem"
  time:       "48:00:00"
  mem:        "256G"

# ── Filtering & Annotation ───────────────────────────────────────────────────
filter_replicates:
  time:       "02:00:00"
  mem:        "64G"

annotate_genes:
  time:       "02:00:00"
  mem:        "64G"

# ── Gene List Extraction ──────────────────────────────────────────────────────
extract_target_genes:
  time:       "00:10:00"
  mem:        "16G"

rank_genes_by_editing:
  time:       "00:10:00"
  mem:        "16G"

compile_alignment_stats:
  time:       "00:10:00"
  mem:        "16G"

# ── Visualisation ─────────────────────────────────────────────────────────────
plot_editing_frequency_distribution:
  time:       "00:30:00"
  mem:        "32G"

plot_chromosome_distribution:
  time:       "00:30:00"
  mem:        "32G"

plot_gene_biotype_distribution:
  time:       "00:30:00"
  mem:        "32G"

generate_bigwig:
  time:       "02:00:00"
  mem:        "64G"

# ── HTML Report ───────────────────────────────────────────────────────────────
generate_report:
  time:       "00:30:00"
  mem:        "32G"
