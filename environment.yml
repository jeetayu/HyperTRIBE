name: hypertribe
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.9
  
  # Bioinformatics tools
  - fastp=0.23.2
  - star=2.7.10a
  - samtools=1.17
  - bedtools=2.30.0
  
  # Workflow management
  - snakemake=7.32.4
  
  # Python scientific packages
  - pysam=0.21.0
  - scipy=1.11.3
  - numpy=1.24.3
  - pandas=2.0.3
  
  # Plotting
  - matplotlib=3.7.2
  - seaborn=0.12.2
  
  # Utilities
  - biopython=1.81
  - pyyaml

  # Quarto report rendering
  - jupyter
  - ipykernel
  - nbformat
  - quarto          # install Quarto CLI separately: https://quarto.org/docs/get-started/

  # Development tools (optional)
  - pytest
  - black
  - pylint

  # Pip packages
  - pip
  - pip:
    - pybedtools
