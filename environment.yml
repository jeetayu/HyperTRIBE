name: hypertribe
channels:
  - conda-forge
  - defaults
dependencies:
  # Python runtime
  - python>=3.9,<3.11

  # Workflow engine
  - snakemake>=7.32,<8

  # Python scientific stack (used by scripts/ and notebooks/)
  - pip
  - pip:
    - pysam>=0.21
    - scipy>=1.11
    - numpy>=1.24,<2
    - pandas>=2.0
    - matplotlib>=3.7
    - seaborn>=0.12
    - biopython>=1.81
    - pyyaml
    - pybedtools
    - jupyter
    - ipykernel
    - nbformat

# NOTE: All bioinformatics tools (cutadapt, STAR, samtools, bedtools,
# deeptools, picard, multiqc) run via Singularity containers defined
# in the Snakefile — no conda install needed for them.
